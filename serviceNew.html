<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connecto - Service Form</title>
    <link rel="stylesheet" href="./src/css/styles.css" />
</head>

<body>
    <main class="container">
        <h1 id="pageTitle">New Service</h1>

        <div style="display:flex; gap:12px; margin: 12px 0;">
            <a href="/services.html">Back</a>
            <a href="#" id="logoutLink">Logout</a>
        </div>

        <form id="serviceForm">
            <label for="serviceTitle">Title</label>
            <input id="serviceTitle" type="text" required />

            <label for="serviceDesc">Description</label>
            <input id="serviceDesc" type="text" required />

            <label for="serviceCate">Category</label>
            <select id="serviceCate" required></select>

            <label for="serviceSubCate">Sub Category</label>
            <select id="serviceSubCate" required></select>

            <label for="serviceCity">City</label>
            <input id="serviceCity" type="text" required />

            <label for="serviceCountry">Country</label>
            <input id="serviceCountry" type="text" required />

            <div id="photosSection" style="margin-top:16px;"></div>

            <label style="display:flex; gap:8px; align-items:center; margin-top:12px;">
                <input id="serviceIsActive" type="checkbox" checked />
                Active
            </label>

            <button type="submit" id="saveBtn">Save</button>
        </form>

        <p id="msg" class="msg"></p>
    </main>

    <script type="module" src="./src/js/services/services-actions.js"></script>
</body>

</html>
