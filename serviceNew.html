<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connecto - Service Details</title>
    <link rel="stylesheet" href="./src/css/styles.css" />
</head>

<body>
    <main class="container">
        <h1>New Service</h1>

        <div style="display:flex; gap:12px; margin: 12px 0;">
            <a href="/services.html">Back</a>
            <a href="#" id="logoutLink">Logout</a>
        </div>

        <form id="serviceForm">
            <label>Title</label>
            <input id="serviceTitle" type="text" required />

            <label>Description</label>
            <input id="serviceDesc" type="text" required />

            <label>Category</label>
            <input id="serviceCate" type="text" required />

            <label>City</label>
            <input id="serviceCity" type="text" required />

            <label>Country</label>
            <input id="serviceCountry" type="text" required />

            <button type="submit">Save</button>
        </form>

        <p id="msg" class="msg"></p>
    </main>

    <script type="module" src="./src/js/serviceActions.js"></script>
</body>

</html>
