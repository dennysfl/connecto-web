<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connecto - Services</title>
    <link rel="stylesheet" href="./src/css/styles.css" />
</head>

<body>
    <main class="container">
        <h1>Services</h1>
        <p class="muted">Browse available services and save favorites.</p>

        <div style="display:flex; gap:12px; margin: 12px 0;">
            <a href="/dashboard.html">Back to Dashboard</a>
            <a href="#" id="logoutLink">Logout</a>
        </div>

        <div style="display:flex; gap:12px; margin: 12px 0;">
            <a href="/serviceNew.html">New Service</a>
        </div>

        <div class="card" style="margin-bottom:12px;">
            <label for="categoryFilter">Category</label>
            <select id="categoryFilter">
                <option value="">All</option>
            </select>

            <div style="margin-top:10px; display:flex; gap:10px;">
                <button id="clearFiltersBtn" type="button">Clear filters</button>
            </div>

            <label style="display:flex; gap:8px; align-items:center; margin-top:10px;">
                <input id="onlyFavs" type="checkbox" /> Only favorites
            </label>

            <label style="display:flex; gap:8px; align-items:center; margin-top:10px;">
                <input id="myServices" type="checkbox" /> My Services
            </label>
        </div>

        <p class="muted">Saved: <strong id="savedCount">0</strong></p>
        <p class="muted">Total: <strong id="totalServices">0</strong></p>
        <p class="muted">My Services: <strong id="totalMyServices">0</strong></p>
        <p id="msg" class="msg"></p>
        <div id="servicesList"></div>
    </main>

    <script type="module" src="./src/js/services.js"></script>
</body>

</html>
