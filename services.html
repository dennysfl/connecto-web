<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connecto - Services</title>
    <link rel="stylesheet" href="./src/css/styles.css" />
</head>

<body>
    <main class="container">
        <h1>Services</h1>
        <p class="muted">Browse available services and save favorites.</p>

        <div style="display:flex; gap:12px; margin: 12px 0;">
            <a href="/dashboard.html">Back to Dashboard</a>
            <a href="#" id="logoutLink">Logout</a>
        </div>

        <div style="display:flex; gap:12px; margin: 12px 0;">
            <a href="/serviceNew.html">New Service</a>
        </div>

        <div class="card" style="margin-bottom:12px;">
            <label for="searchText">Search</label>
            <input id="searchText"></input>

            <label for="categoryFilter">Category</label>
            <select id="categoryFilter">
                <option value="">All</option>
            </select>

            <label for="subcategoryFilter">Sub Category</label>
            <select id="subcategoryFilter">
                <option value="">All</option>
            </select>

            <div style="margin-top:10px; display:flex; gap:10px;">
                <button id="runFiltersBtn" type="button">Show Results</button>
                <button id="clearFiltersBtn" type="button">Clear filters</button>
            </div>

            <label style="display:flex; gap:8px; align-items:center; margin-top:10px;">
                <input id="onlyFavs" type="checkbox" /> Only favorites
                <input id="myServices" type="checkbox" /> My Services
                <input id="myInactive" type="checkbox" /> My Inactive Services
            </label>
        </div>

        <p class="muted">
            Saved: <strong id="savedCount">0</strong>
            | My Services: <strong id="totalMyServices">0</strong>
            | Total: <strong id="totalServices">0</strong>
        </p>

        <label for="sortService">Sort by:</label>
        <select id="sortService">
            <option value="Newest">Newest</option>
            <option value="Oldest">Oldest</option>
            <option value="AZ">A-Z</option>
        </select>

        <label for="paginationService">Show Results:</label>
        <select id="paginationService">
            <option value="2">2</option>
            <option value="5">5</option>
            <option value="10">10</option>
            <option value="All">All</option>
        </select>

        <p id="msg" class="msg"></p>
        <div id="servicesList"></div>

        <div id="pagination" style="display:flex; gap:12px; align-items:center; margin-top:16px;"></div>
    </main>

    <script type="module" src="./src/js/services/services.js"></script>
</body>

</html>
